<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamilyWealth Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#2dd4bf', danger: '#f43f5e', income: '#6366f1', darkbg: '#0f172a', cardbg: '#1e293b' } } } }
    </script>
    <style> body { background-color: #000; font-family: sans-serif; } ::-webkit-scrollbar { width: 0px; } </style>
</head>
<body class="flex justify-center min-h-screen text-gray-200">
    <div class="w-full max-w-md bg-darkbg min-h-screen flex flex-col">
        
        <div id="login-page" class="flex flex-col justify-center h-screen px-8">
            <h1 class="text-3xl font-bold text-white text-center mb-8">Family<span class="text-neon">Wealth</span></h1>
            <input type="text" id="username" placeholder="Username" class="w-full bg-cardbg p-4 rounded-xl mb-4 border border-gray-700">
            <input type="password" id="password" placeholder="Password" class="w-full bg-cardbg p-4 rounded-xl mb-4 border border-gray-700">
            <button onclick="login()" id="login-btn" class="w-full bg-neon text-darkbg font-bold py-4 rounded-xl">Masuk</button>
        </div>

        <div id="dashboard-page" class="hidden flex-col h-full pb-20">
            <div class="p-6 bg-cardbg/50 border-b border-gray-800">
                <p class="text-xs text-gray-400">Selamat datang,</p>
                <h2 class="text-xl font-bold text-white" id="user-display"></h2>
            </div>
            <div class="p-5 flex-grow overflow-y-auto">
                <div class="bg-cardbg rounded-2xl p-6 mb-6">
                    <p class="text-gray-400 text-sm">Sisa Saldo</p>
                    <h1 class="text-3xl font-bold text-white" id="sisa-saldo">Rp 0</h1>
                </div>
                <div class="bg-cardbg rounded-2xl p-5 mb-6">
                    <canvas id="expenseChart"></canvas>
                </div>
                <div id="transaction-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec';

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const res = await fetch(`${SCRIPT_URL}?action=login&username=${user}&password=${pass}`);
            const data = await res.json();
            if(data.status === 'success') {
                localStorage.setItem('user', JSON.stringify(data));
                location.reload();
            } else { alert('Login Gagal'); }
        }

        async function loadDashboard() {
            const user = JSON.parse(localStorage.getItem('user'));
            if(!user) return;
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');
            document.getElementById('dashboard-page').classList.add('flex');
            document.getElementById('user-display').innerText = user.username;

            const res = await fetch(`${SCRIPT_URL}?action=getData&username=${user.username}&role=${user.role}&filterPencatat=Semua`);
            const resData = await res.json();
            const d = resData.data;
            document.getElementById('sisa-saldo').innerText = 'Rp ' + d.sisa.toLocaleString('id-ID');
            
            const list = document.getElementById('transaction-list');
            d.riwayat.forEach(t => {
                list.innerHTML += `<div class="bg-cardbg p-4 rounded-xl flex justify-between border border-gray-800">
                    <div><p class="text-sm font-bold text-white">${t.keterangan}</p><p class="text-xs text-gray-400">${t.kategori}</p></div>
                    <p class="text-sm font-bold ${t.jenis == 'Pemasukan' ? 'text-neon' : 'text-danger'}">Rp ${t.nominal.toLocaleString('id-ID')}</p>
                </div>`;
            });
        }
        
        window.onload = loadDashboard;
    </script>
</body>
</html>
