<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Keluarga Pro - Dashboard Keuangan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500/30">

    <div id="loginPage" class="fixed inset-0 bg-slate-950/95 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl"></div>
            
            <div class="w-16 h-16 bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-emerald-900/40 mb-4">
                <i class="fa-solid fa-wallet text-2xl text-white"></i>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight text-center mb-1">DompetKeluarga</h2>
            <p class="text-xs text-slate-400 text-center mb-6">Masuk menggunakan akun Google Sheet Anda</p>
            
            <div class="text-left mb-4">
                <label class="text-[11px] text-slate-400 font-bold uppercase tracking-wider block mb-1.5">Nama Pengguna</label>
                <input type="text" id="username" placeholder="Admin / Suami / Istri" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-all text-sm">
            </div>
            
            <div class="text-left mb-6 relative">
                <label class="text-[11px] text-slate-400 font-bold uppercase tracking-wider block mb-1.5">Kata Sandi</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-all text-sm">
                <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-10 text-slate-500 hover:text-white transition">
                    <i id="toggleIcon" class="fa-solid fa-eye-slash text-sm"></i>
                </button>
            </div>
            
            <button id="btnLogin" onclick="prosesLogin()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-xl shadow-emerald-950/50 transition-all transform active:scale-98 text-sm cursor-pointer">
                Masuk Ke Dashboard
            </button>
        </div>
    </div>

    <div id="dashboardPage" class="hidden flex-1 flex flex-col pb-24">
        <header class="sticky top-0 bg-slate-900/80 backdrop-blur-md px-5 py-4 border-b border-slate-800/60 flex items-center justify-between z-40">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-emerald-950">
                    <i class="fa-solid fa-user-shield text-sm"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wide">Pengelola Sistem</p>
                    <div class="flex items-center gap-2">
                        <h1 id="userDisplay" class="text-sm font-bold text-white">User</h1>
                        <span id="roleBadge" class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider">PRO</span>
                    </div>
                </div>
            </div>
