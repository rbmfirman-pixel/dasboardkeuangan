<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";
    let globalTransactions = []; 
    let chartInstance = null;
    let chartDoughnutInstance = null;
    let chartTrendInstance = null;
    let chartCompareInstance = null;
    
    const formatter = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });

    // FUNGSI BARU: Mendapatkan tanggal dari Tgl atau Timestamp
    function getTrxDate(trx) {
        if (!trx) return new Date();
        const tglAktual = trx.Tgl ? new Date(trx.Tgl) : null;
        if (tglAktual && !isNaN(tglAktual)) return tglAktual;
        return new Date(trx.timestamp);
    }

    // UPDATE: Logika Sistem Tema (Dark/Light/Auto)
    function initTheme() {
        const savedTheme = localStorage.getItem('fw_theme') || 'auto';
        setTheme(savedTheme);
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (localStorage.getItem('fw_theme') === 'auto') {
                applyDarkClass(e.matches);
            }
        });
    }

    function applyDarkClass(isDark) {
        if (isDark) { document.documentElement.classList.add('dark'); } 
        else { document.documentElement.classList.remove('dark'); }
        
        Chart.defaults.color = isDark ? '#94a3b8' : '#64748b';
        if(chartInstance) chartInstance.update();
        if(chartDoughnutInstance) chartDoughnutInstance.update();
        if(chartTrendInstance) chartTrendInstance.update();
        if(chartCompareInstance) chartCompareInstance.update();
    }

    function setTheme(theme) {
        localStorage.setItem('fw_theme', theme);
        
        if (theme === 'dark') { applyDarkClass(true); } 
        else if (theme === 'light') { applyDarkClass(false); } 
        else { applyDarkClass(window.matchMedia('(prefers-color-scheme: dark)').matches); }

        ['light', 'dark', 'auto'].forEach(t => {
            const btn = document.getElementById(`btn-theme-${t}`);
            if(btn) {
                if (t === theme) {
                    btn.classList.add('bg-white', 'dark:bg-slate-700', 'text-slate-800', 'dark:text-white', 'shadow-sm');
                    btn.classList.remove('text-slate-500', 'dark:text-slate-400');
                } else {
                    btn.classList.remove('bg-white', 'dark:bg-slate-700', 'text-slate-800', 'dark:text-white', 'shadow-sm');
                    btn.classList.add('text-slate-500', 'dark:text-slate-400');
                }
            }
        });
    }

    function togglePassword() { const p = document.getElementById("password"); const i = document.getElementById("eye-icon"); if(p.type === "password") { p.type = "text"; i.innerText = "🙈"; } else { p.type = "password"; i.innerText = "👁️"; } }
    
    function handleLogin(e) { 
        e.preventDefault(); 
        const user = document.getElementById("username").value; 
        const pass = document.getElementById("password").value; 
        document.getElementById("loader").classList.remove("hidden"); 
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", username: user, password: pass }) })
        .then(res => res.json()).then(res => { 
            if(res.status === "success") { localStorage.setItem("fw_user", user); location.reload(); } 
            else { document.getElementById("loader").classList.add("hidden"); alert(res.message); } 
        }).catch(err => { 
            console.error("Login Error:", err);
            document.getElementById("loader").classList.add("hidden"); 
            alert("Gagal menghubungi server."); 
        }); 
    }
    
    function handleLogout() { localStorage.clear(); location.reload(); }

    function toggleSettings() {
        const modal = document.getElementById("settings-modal");
        const modalBox = document.getElementById("settings-modal-box");
        const user = localStorage.getItem("fw_user") || "Guest";
        
        document.getElementById("txt-user-display").innerText = user;
        
        if (modal.classList.contains("opacity-0")) {
            modal.classList.remove("opacity-0", "pointer-events-none");
            modalBox.classList.remove("scale-95", "translate-y-4");
            modalBox.classList.add("scale-100", "translate-y-0");
        } else {
            modal.classList.add("opacity-0", "pointer-events-none");
            modalBox.classList.remove("scale-100", "translate-y-0");
            modalBox.classList.add("scale-95", "translate-y-4");
        }
    }

    function clearCache() {
        if(confirm("Apakah Anda ingin memuat ulang semua data dari server?")) {
            toggleSettings();
            loadDataFromServer(true);
        }
    }

    function switchTab(tab) {
        const views = ['home', 'riwayat', 'laporan'];
        const titles = { 'home': 'Dashboard', 'riwayat': 'Riwayat Transaksi', 'laporan': 'Laporan Keuangan' };
        
        views.forEach(v => {
            const viewEl = document.getElementById(`view-${v}`);
            const navEl = document.getElementById(`nav-${v}`);
            if(v === tab) {
                viewEl.classList.remove("hidden");
                navEl.classList.replace("text-slate-400", "text-indigo-600");
                navEl.classList.replace("dark:text-slate-500", "dark:text-indigo-400");
            } else {
                viewEl.classList.add("hidden");
                navEl.classList.replace("text-indigo-600", "text-slate-400");
                navEl.classList.replace("dark:text-indigo-400", "dark:text-slate-500");
            }
        });
        
        document.getElementById("header-title").innerText = titles[tab];
        
        if(tab === 'riwayat') renderRiwayatLengkap();
        if(tab === 'laporan') renderLaporanKeuangan();
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function refreshActiveTab() {
        if(!document.getElementById("view-riwayat").classList.contains("hidden")) renderRiwayatLengkap();
        if(!document.getElementById("view-laporan").classList.contains("hidden")) renderLaporanKeuangan();
    }

    function loadDataFromServer(isReload = false) {
      document.getElementById("loader").classList.remove("opacity-0", "pointer-events-none");
      
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTransactions" }) })
      .then(response => response.json())
      .then(res => { 
        if(res.status === "success") {
            globalTransactions = res.data;
            if(!isReload) {
                const curM = new Date().getMonth().toString();
                document.getElementById("filter-bulan").value = curM;
                document.getElementById("filter-riwayat-bulan").value = curM;
                document.getElementById("filter-laporan-bulan").value = curM;
                
                const user = localStorage.getItem("fw_user");
                const filterPencatat = document.getElementById("filter-pencatat");
                
                if (user && user.toLowerCase() !== "admin") {
                    let matchedOpt = Array.from(filterPencatat.options).find(opt => opt.value.toLowerCase() === user.toLowerCase());
                    if(matchedOpt) { filterPencatat.value = matchedOpt.value; } 
                    else { filterPencatat.innerHTML = `<option value="${user}">${user}</option>`; }
                    
                    filterPencatat.disabled = true;
                    filterPencatat.classList.add("bg-slate-100", "text-slate-500", "cursor-not-allowed", "dark:bg-slate-800");
                } else {
                    filterPencatat.disabled = false;
                    filterPencatat.classList.remove("bg-slate-100", "text-slate-500", "cursor-not-allowed", "dark:bg-slate-800");
                }
            }
            initRiwayatFilters(); 
            renderFilteredData(); 
            refreshActiveTab();
        } else { 
            alert("Gagal memuat data: " + res.message); 
        }
        document.getElementById("loader").classList.add("opacity-0", "pointer-events-none"); 
      }).catch(err => { 
          console.error("Fetch Error:", err);
          document.getElementById("loader").classList.add("opacity-0", "pointer-events-none"); 
          alert("Gagal mengambil data dari Google Sheet. Periksa koneksi internet Anda."); 
      });
    }

    function initRiwayatFilters() {
        const selectTahun = document.getElementById("filter-riwayat-tahun");
        const selectLaporanTahun = document.getElementById("filter-laporan-tahun");
        
        const currTahun = selectTahun.value;
        const currLapTahun = selectLaporanTahun.value;
        
        selectTahun.innerHTML = '<option value="all">Semua Tahun</option>';
        selectLaporanTahun.innerHTML = '<option value="all">Semua Tahun</option>';
        
        const tahunSet = new Set();
        const selectKategori = document.getElementById("filter-riwayat-kategori");
        const currKategori = selectKategori.value;
        selectKategori.innerHTML = '<option value="all">Semua Kategori</option>';
        const kategoriSet = new Set();

        globalTransactions.forEach(trx => { 
            const date = getTrxDate(trx); // Pakai fungsi baru
            if(date) { 
                const year = date.getFullYear(); 
                if(year && !isNaN(year)) tahunSet.add(year); 
            } 
            if(trx.kategori) {
                kategoriSet.add(trx.kategori.toString().trim());
            }
        });

        Array.from(tahunSet).sort((a,b) => b - a).forEach(thn => { 
            let opt1 = document.createElement("option"); opt1.value = thn; opt1.text = thn; selectTahun.appendChild(opt1); 
            let opt2 = document.createElement("option"); opt2.value = thn; opt2.text = thn; selectLaporanTahun.appendChild(opt2); 
        });
        
        const currentYear = new Date().getFullYear().toString();
        if(currTahun && currTahun !== "all") selectTahun.value = currTahun;
        else { if(document.querySelector(`#filter-riwayat-tahun option[value="${currentYear}"]`)) selectTahun.value = currentYear; }

        if(currLapTahun && currLapTahun !== "all") selectLaporanTahun.value = currLapTahun;
        else { if(document.querySelector(`#filter-laporan-tahun option[value="${currentYear}"]`)) selectLaporanTahun.value = currentYear; }

        Array.from(kategoriSet).sort().forEach(kat => {
            let option = document.createElement("option"); option.value = kat.toLowerCase(); option.text = kat; selectKategori.appendChild(option);
        });
        if(currKategori && currKategori !== "all") selectKategori.value = currKategori;
    }

    function renderRiwayatLengkap() {
        const currentUser = (localStorage.getItem("fw_user") || "").toLowerCase();
        const rawFilterP = document.getElementById("filter-pencatat").value.toLowerCase();
        const filterP = (currentUser === "admin") ? rawFilterP : currentUser; 

        const filterB = document.getElementById("filter-riwayat-bulan").value;
        const filterT = document.getElementById("filter-riwayat-tahun").value;
        const filterK = document.getElementById("filter-riwayat-kategori").value.toLowerCase(); 
        const searchVal = document.getElementById("search-riwayat").value.toLowerCase();
        
        let filtered = globalTransactions.filter(trx => {
            const date = getTrxDate(trx); // Pakai fungsi baru
            if(!date || isNaN(date)) return false;

            const pencatatStr = (trx.pencatat || "").toString().toLowerCase();
            const kategoriStr = (trx.kategori || "").toString().toLowerCase().trim();
            const ketStr = (trx.keterangan || "").toString().toLowerCase();

            const matchPencatat = (filterP === "all" || pencatatStr === filterP);
            const matchBulan = (filterB === "all" || date.getMonth().toString() === filterB);
            const matchTahun = (filterT === "all" || date.getFullYear().toString() === filterT);
            const matchKategori = (filterK === "all" || kategoriStr === filterK); 
            const matchSearch = (searchVal === "" || kategoriStr.includes(searchVal) || ketStr.includes(searchVal));
            
            return matchPencatat && matchBulan && matchTahun && matchKategori && matchSearch;
        });
        
        filtered.sort((a, b) => getTrxDate(b) - getTrxDate(a)); // Pakai fungsi baru
        let html = "";
        filtered.forEach(trx => {
            const isPengeluaran = (trx.jenis || "").toString().toLowerCase() === 'pengeluaran';
            const pencatatText = trx.pencatat ? trx.pencatat.toString() : '?';
            const badgeColor = pencatatText.toLowerCase() === 'suami' ? 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400' : 'bg-pink-100 dark:bg-pink-900/30 text-pink-700 dark:text-pink-400';
            html += `<div class="card p-4 flex flex-col gap-2 select-none transition-colors">
                <div class="flex justify-between items-center border-b border-slate-50 dark:border-slate-700/50 pb-2"><span class="text-[10px] font-bold text-slate-400 dark:text-slate-500">📅 ${getTrxDate(trx).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })}</span><span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${badgeColor}">${pencatatText}</span></div>
                <div class="flex justify-between items-center pt-1"><div class="min-w-0 pr-3 flex-1"><p class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">${trx.kategori || "-"}</p><p class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">${trx.keterangan || "-"}</p></div><span class="${isPengeluaran ? 'text-rose-500 dark:text-rose-400' : 'text-emerald-500 dark:text-emerald-400'} font-bold text-sm">${isPengeluaran ? '-' : '+'}${formatter.format(trx.nominal)}</span></div>
            </div>`;
        });
        document.getElementById("list-riwayat-lengkap").innerHTML = html || '<div class="text-center py-10 select-none"><p class="text-sm text-slate-500 dark:text-slate-400">Tidak ada transaksi.</p></div>';
    }

    function renderFilteredData() {
      const currentUser = (localStorage.getItem("fw_user") || "").toLowerCase();
      const rawFilterP = document.getElementById("filter-pencatat").value.toLowerCase();
      const filterP = (currentUser === "admin") ? rawFilterP : currentUser; 
      
      const filterB = document.getElementById("filter-bulan").value;
      let saldoAwal = 0; let totalP = 0; let totalK = 0;
      
      globalTransactions.forEach(trx => {
        const d = getTrxDate(trx); // Pakai fungsi baru
        if(isNaN(d)) return;

        const m = d.getMonth().toString(); 
        const n = parseFloat(trx.nominal) || 0;
        const jenis = (trx.jenis || "").toString().toLowerCase();
        
        if (filterP !== "all" && (trx.pencatat || "").toString().toLowerCase() !== filterP) return;
        
        if (filterB === "all") { 
            if (jenis === "pemasukan") saldoAwal += n; 
        } else { 
            if (parseInt(m) < parseInt(filterB)) { 
                saldoAwal += (jenis === "pemasukan" ? n : -n); 
            } 
        }
        
        if (filterB === "all" || m === filterB) { 
            if (jenis === "pemasukan") totalP += n; else totalK += n; 
        }
      });
      
      document.getElementById("txt-saldo-awal").innerText = formatter.format(filterB === "all" ? totalP : saldoAwal);
      document.getElementById("txt-pengeluaran").innerText = formatter.format(totalK);
      document.getElementById("txt-saldo").innerText = formatter.format((filterB === "all" ? totalP : saldoAwal) + totalP - totalK);
      
      let html = "";
      globalTransactions.filter(t => {
          const date = getTrxDate(t); // Pakai fungsi baru
          if(isNaN(date)) return false;
          const matchP = filterP === "all" || (t.pencatat || "").toString().toLowerCase() === filterP;
          const matchB = filterB === "all" || date.getMonth().toString() === filterB;
          return matchP && matchB;
      }).sort((a,b) => getTrxDate(b) - getTrxDate(a)).slice(0, 5).forEach(trx => {
        const isPengeluaran = (trx.jenis || "").toString().toLowerCase() === 'pengeluaran';
        html += `<div class="flex justify-between items-center py-2 border-b border-slate-50 dark:border-slate-700/50 last:border-0 select-none transition-colors"><div class="min-w-0 pr-4 flex-1"><p class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate">${trx.kategori || "-"}</p><p class="text-[11px] text-slate-400 dark:text-slate-500 truncate mt-0.5">${trx.keterangan || "-"}</p></div><span class="${isPengeluaran ? 'text-rose-500 dark:text-rose-400' : 'text-emerald-500 dark:text-emerald-400'} font-bold text-sm">${isPengeluaran ? '-' : '+'}${formatter.format(trx.nominal)}</span></div>`;
      });
      document.getElementById("list-riwayat-singkat").innerHTML = html || `<p class="text-sm text-slate-400 dark:text-slate-500 text-center py-4 select-none">Belum ada transaksi.</p>`;
      renderDailyChart();
    }

    function renderDailyChart() {
      const currentUser = (localStorage.getItem("fw_user") || "").toLowerCase();
      const rawFilterP = document.getElementById("filter-pencatat").value.toLowerCase();
      const filterP = (currentUser === "admin") ? rawFilterP : currentUser; 

      const labels = []; const data = []; const today = new Date();
      for(let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(today.getDate() - i);
        labels.push(d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }));
        let ds = 0;
        globalTransactions.forEach(trx => {
          const tD = getTrxDate(trx); // Pakai fungsi baru
          if(isNaN(tD)) return;

          const matchPencatat = (filterP === "all" || (trx.pencatat || "").toString().toLowerCase() === filterP);
          
          if (tD.getDate() === d.getDate() && tD.getMonth() === d.getMonth() && tD.getFullYear() === d.getFullYear() && matchPencatat && (trx.jenis || "").toString().toLowerCase() === 'pengeluaran') {
              ds += parseFloat(trx.nominal) || 0;
          }
        });
        data.push(ds);
      }
      
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('canvasTrenSaldo'), {
        type: 'line',
        data: { labels: labels, datasets: [{ label: 'Pengeluaran 7 Hari Terakhir', data: data, borderColor: '#4f46e5', backgroundColor: 'rgba(79, 70, 229, 0.1)', fill: true, tension: 0.4, pointRadius: 6, pointBackgroundColor: '#4f46e5' }] },
        options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, elements: { point: { hitRadius: 25 } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
      });
    }

    function renderLaporanKeuangan() {
        const currentUser = (localStorage.getItem("fw_user") || "").toLowerCase();
        const rawFilterP = document.getElementById("filter-pencatat").value.toLowerCase();
        const filterP = (currentUser === "admin") ? rawFilterP : currentUser; 
        
        const filterB = document.getElementById("filter-laporan-bulan").value;
        const filterT = document.getElementById("filter-laporan-tahun").value;
        
        let totalPemasukan = 0;
        let totalPengeluaran = 0;
        const kategoriMap = {};
        
        globalTransactions.forEach(trx => {
            const date = getTrxDate(trx); // Pakai fungsi baru
            if(isNaN(date)) return;
            
            const matchPencatat = (filterP === "all" || (trx.pencatat || "").toString().toLowerCase() === filterP);
            const matchBulan = (filterB === "all" || date.getMonth().toString() === filterB);
            const matchTahun = (filterT === "all" || date.getFullYear().toString() === filterT);
            
            if(matchPencatat && matchBulan && matchTahun) {
                const nominal = parseFloat(trx.nominal) || 0;
                const jenis = (trx.jenis || "").toString().toLowerCase();
                
                if(jenis === 'pemasukan') {
                    totalPemasukan += nominal;
                } else if(jenis === 'pengeluaran') {
                    totalPengeluaran += nominal;
                    const kat = trx.kategori ? trx.kategori.toString().trim() : "Lainnya";
                    kategoriMap[kat] = (kategoriMap[kat] || 0) + nominal;
                }
            }
        });
        
        document.getElementById("rep-total-masuk").innerText = formatter.format(totalPemasukan);
        document.getElementById("rep-total-keluar").innerText = formatter.format(totalPengeluaran);
        
        const katLabels = Object.keys(kategoriMap);
        const katData = Object.values(kategoriMap);
        
        if(chartDoughnutInstance) chartDoughnutInstance.destroy();
        
        if(katData.length > 0) {
            document.getElementById("canvasDistribusiKategori").classList.remove("hidden");
            document.getElementById("no-data-doughnut").classList.add("hidden");
            
            chartDoughnutInstance = new Chart(document.getElementById('canvasDistribusiKategori'), {
                type: 'doughnut',
                data: {
                    labels: katLabels,
                    datasets: [{
                        data: katData,
                        backgroundColor: ['#4f46e5', '#10b981', '#f43f5e', '#f59e0b', '#06b6d4', '#8b5cf6', '#ec4899', '#64748b'],
                        borderWidth: 0 
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Plus Jakarta Sans', size: 11 } } } }
                }
            });
        } else {
            document.getElementById("canvasDistribusiKategori").classList.add("hidden");
            document.getElementById("no-data-doughnut").classList.remove("hidden");
        }
        
        const targetYear = filterT === "all" ? new Date().getFullYear().toString() : filterT;
        const bulananIn = Array(12).fill(0);
        const bulananOut = Array(12).fill(0);
        
        globalTransactions.forEach(trx => {
            const date = getTrxDate(trx); // Pakai fungsi baru
            if(isNaN(date)) return;

            if(date.getFullYear().toString() === targetYear) {
                const matchPencatat = (filterP === "all" || (trx.pencatat || "").toString().toLowerCase() === filterP);
                if(matchPencatat) {
                    const m = date.getMonth();
                    const n = parseFloat(trx.nominal) || 0;
                    const jenis = (trx.jenis || "").toString().toLowerCase();

                    if(jenis === 'pemasukan') bulananIn[m] += n;
                    else if(jenis === 'pengeluaran') bulananOut[m] += n;
                }
            }
        });
        
        const namaBulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
        if(chartTrendInstance) chartTrendInstance.destroy();
        chartTrendInstance = new Chart(document.getElementById('canvasTrenBulanan'), {
            type: 'bar',
            data: {
                labels: namaBulan,
                datasets: [
                    { label: 'Pemasukan', data: bulananIn, backgroundColor: 'rgba(16, 185, 129, 0.85)', borderRadius: 6 },
                    { label: 'Pengeluaran', data: bulananOut, backgroundColor: 'rgba(244, 63, 94, 0.85)', borderRadius: 6 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { display: false }, x: { grid: { display: false }, ticks: { font: { family: 'Plus Jakarta Sans', size: 10 } } } },
                plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { family: 'Plus Jakarta Sans', size: 11 } } } }
            }
        });
        
        const compSection = document.getElementById("admin-comparison-section");
        if(currentUser === "admin") {
            compSection.classList.remove("hidden");
            
            const pencatatMap = {}; 
            
            globalTransactions.forEach(trx => {
                const date = getTrxDate(trx); // Pakai fungsi baru
                if(isNaN(date)) return;

                const matchBulan = (filterB === "all" || date.getMonth().toString() === filterB);
                const matchTahun = (filterT === "all" || date.getFullYear().toString() === filterT);
                
                if(matchBulan && matchTahun) {
                    const pencatat = trx.pencatat ? trx.pencatat.toString().trim() : "Lainnya";
                    const n = parseFloat(trx.nominal) || 0;
                    const jenis = (trx.jenis || "").toString().toLowerCase();
                    
                    if(!pencatatMap[pencatat]) {
                        pencatatMap[pencatat] = { in: 0, out: 0 };
                    }
                    
                    if(jenis === "pemasukan") {
                        pencatatMap[pencatat].in += n;
                    } else if(jenis === "pengeluaran") {
                        pencatatMap[pencatat].out += n;
                    }
                }
            });
            
            const compLabels = Object.keys(pencatatMap);
            const dataIn = compLabels.map(key => pencatatMap[key].in);
            const dataOut = compLabels.map(key => pencatatMap[key].out);
            
            if(chartCompareInstance) chartCompareInstance.destroy();
            chartCompareInstance = new Chart(document.getElementById('canvasKomparasiPasangan'), {
                type: 'bar',
                data: {
                    labels: compLabels,
                    datasets: [
                        { label: 'Pemasukan', data: dataIn, backgroundColor: '#10b981', borderRadius: 6 },
                        { label: 'Pengeluaran', data: dataOut, backgroundColor: '#f43f5e', borderRadius: 6 }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { font: { size: 10 } } }, y: { grid: { display: false }, ticks: { font: { fontStyle: 'bold' } } } },
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
                }
            });
        } else {
            compSection.classList.add("hidden");
        }
    }

    window.onload = () => {
        initTheme(); 
        if(localStorage.getItem("fw_user")) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("app-section").classList.remove("hidden");
            document.getElementById("bottom-nav").classList.remove("hidden");
            document.getElementById("btn-reload").classList.remove("hidden");
            loadDataFromServer();
        } else {
            document.getElementById("login-section").classList.remove("hidden");
            document.getElementById("loader").classList.add("opacity-0", "pointer-events-none");
        }
    };
  </script>
