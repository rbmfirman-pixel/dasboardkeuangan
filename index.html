<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyWealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #f1f5f9; }
    .toggle-password { cursor: pointer; }
  </style>
</head>
<body class="min-h-screen text-slate-800">

  <div id="login-section" class="fixed inset-0 flex items-center justify-center p-4 z-50 bg-slate-50">
    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
      <h1 class="text-2xl font-bold text-center mb-6 text-slate-800">FamilyWealth</h1>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="username" placeholder="Username" required class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
        <div class="relative">
          <input type="password" id="password" placeholder="Password" required class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
          <span onclick="togglePassword()" class="absolute right-4 top-4 cursor-pointer text-slate-400" id="eye-icon">👁️</span>
        </div>
        <button type="submit" id="btn-login" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 active:scale-95 transition-all">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden pb-10 max-w-lg mx-auto fade-in">
    <header class="p-6 flex justify-between items-center">
      <h2 class="font-bold text-xl text-slate-800">Dashboard</h2>
      <button onclick="handleLogout()" class="text-xs text-rose-500 font-bold bg-rose-50 px-3 py-1 rounded-full">Keluar</button>
    </header>

    <main class="px-6 space-y-6">
      <select id="filter-pencatat" onchange="renderFilteredData()" class="w-full p-3 rounded-xl border border-slate-200 bg-white font-medium text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="all">Semua Data</option>
        <option value="Suami">Suami</option>
        <option value="Istri">Istri</option>
      </select>

      <div class="bg-indigo-600 text-white p-6 rounded-3xl shadow-lg shadow-indigo-200">
        <p class="text-indigo-200 text-xs uppercase tracking-widest font-bold">Total Sisa Saldo</p>
        <h1 id="txt-saldo" class="text-3xl font-bold mt-2">Rp 0</h1>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="card p-4">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Saldo Awal</p>
          <p id="txt-saldo-awal" class="text-sm font-bold mt-1 text-slate-700">Rp 0</p>
        </div>
        <div class="card p-4">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Pengeluaran</p>
          <p id="txt-pengeluaran" class="text-sm font-bold mt-1 text-rose-500">Rp 0</p>
        </div>
      </div>

      <div class="card p-5 h-64">
        <canvas id="canvasTrenSaldo"></canvas>
      </div>

      <div class="card p-5">
        <h3 class="font-bold text-sm text-slate-700 mb-4">Transaksi Terbaru</h3>
        <div id="list-riwayat-singkat" class="space-y-4"></div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";
    let globalTransactions = [];
    let chartInstance = null;

    function togglePassword() {
      const p = document.getElementById("password");
      const i = document.getElementById("eye-icon");
      if(p.type === "password") { p.type = "text"; i.innerText = "🙈"; }
      else { p.type = "password"; i.innerText = "👁️"; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", username: user, password: pass }) })
      .then(res => res.json()).then(res => {
        if(res.status === "success") {
          localStorage.setItem("fw_user", user);
          location.reload();
        } else alert(res.message);
      });
    }

    function handleLogout() { localStorage.clear(); location.reload(); }

    function renderFilteredData() {
      const filter = document.getElementById("filter-pencatat").value;
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      let saldoAwal = 0;
      let pemasukan = 0;
      let pengeluaran = 0;
      let bulananNet = Array(12).fill(0);

      globalTransactions.forEach(trx => {
        if (filter !== "all" && trx.pencatat !== filter) return;
        const d = new Date(trx.timestamp);
        const val = trx.jenis.toLowerCase() === "pengeluaran" ? -trx.nominal : trx.nominal;

        if (d.getFullYear() === currentYear) bulananNet[d.getMonth()] += val;
        
        if (d.getFullYear() < currentYear || (d.getFullYear() === currentYear && d.getMonth() < currentMonth)) {
          saldoAwal += val;
        } else if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) {
          if (trx.jenis.toLowerCase() === "pengeluaran") pengeluaran += trx.nominal;
          else pemasukan += trx.nominal;
        }
      });

      const formatter = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
      document.getElementById("txt-saldo-awal").innerText = formatter.format(saldoAwal);
      document.getElementById("txt-saldo").innerText = formatter.format(saldoAwal + pemasukan - pengeluaran);
      document.getElementById("txt-pengeluaran").innerText = formatter.format(pengeluaran);

      let dataGrafik = [];
      let running = 0;
      for(let i=0; i<=currentMonth; i++) { running += bulananNet[i]; dataGrafik.push(running); }
      
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('canvasTrenSaldo'), {
        type: 'line',
        data: { labels: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'].slice(0, dataGrafik.length), datasets: [{ label: 'Saldo', data: dataGrafik, borderColor: '#4f46e5', backgroundColor: 'rgba(79, 70, 229, 0.1)', fill: true, tension: 0.4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      let html = "";
      [...globalTransactions].reverse().slice(0, 5).forEach(trx => {
        html += `
          <div class="flex justify-between items-center">
            <div>
              <p class="text-sm font-semibold">${trx.kategori}</p>
              <p class="text-[10px] text-slate-400">${new Date(trx.timestamp).toLocaleDateString()}</p>
            </div>
            <span class="${trx.jenis.toLowerCase() == 'pengeluaran' ? 'text-rose-500' : 'text-emerald-500'} font-bold text-sm">
              ${trx.jenis.toLowerCase() == 'pengeluaran' ? '-' : '+'}${formatter.format(trx.nominal)}
            </span>
          </div>`;
      });
      document.getElementById("list-riwayat-singkat").innerHTML = html;
    }

    if(localStorage.getItem("fw_user")) {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTransactions" }) })
      .then(r => r.json())
      .then(res => { 
        globalTransactions = res.data; 
        renderFilteredData(); 
      });
    }
  </script>
</body>
</html>
