<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyWealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #f1f5f9; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    input, select, button { min-height: 48px; }
    .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); z-index: 100; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body class="min-h-screen text-slate-800">

  <div id="login-section" class="fixed inset-0 flex items-center justify-center p-4 z-50 bg-slate-50">
    <div class="w-full max-w-sm bg-white p-6 rounded-3xl shadow-2xl border border-slate-100">
      <h1 class="text-2xl font-bold text-center mb-6 text-slate-800">FamilyWealth</h1>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="username" placeholder="Username" required class="w-full px-4 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
        <div class="relative">
          <input type="password" id="password" placeholder="Password" required class="w-full px-4 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
          <span onclick="togglePassword()" class="absolute right-4 top-4 cursor-pointer text-slate-400" id="eye-icon">👁️</span>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white rounded-xl font-bold">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden pb-10 max-w-lg mx-auto fade-in">
    <header class="p-6 flex justify-between items-center">
      <h2 class="font-bold text-xl text-slate-800">Dashboard</h2>
      <button onclick="handleLogout()" class="text-xs text-rose-500 font-bold bg-rose-50 px-4 py-2 rounded-full">Keluar</button>
    </header>

    <main class="px-6 space-y-6">
      <div class="grid grid-cols-2 gap-3">
        <select id="filter-pencatat" onchange="renderFilteredData()" class="px-4 rounded-xl border border-slate-200 bg-white font-bold text-sm outline-none">
          <option value="all">Semua Orang</option>
          <option value="Suami">Suami</option>
          <option value="Istri">Istri</option>
        </select>
        <select id="filter-bulan" onchange="renderFilteredData()" class="px-4 rounded-xl border border-slate-200 bg-white font-bold text-sm outline-none">
          <option value="all">Semua Bulan</option>
          <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
          <option value="3">Apr</option><option value="4">Mei</option><option value="5">Jun</option>
        </select>
      </div>

      <div class="bg-indigo-600 text-white p-6 rounded-3xl shadow-lg shadow-indigo-200">
        <p class="text-indigo-200 text-xs uppercase tracking-widest font-bold">Total Sisa Saldo</p>
        <h1 id="txt-saldo" class="text-3xl font-bold mt-2">Rp 0</h1>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="card p-4">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Saldo Awal</p>
          <p id="txt-saldo-awal" class="text-sm font-bold mt-1 text-slate-700">Rp 0</p>
        </div>
        <div class="card p-4">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Pengeluaran</p>
          <p id="txt-pengeluaran" class="text-sm font-bold mt-1 text-rose-500">Rp 0</p>
        </div>
      </div>

      <div class="card p-5 h-64"><canvas id="canvasTrenSaldo"></canvas></div>

      <div class="card p-5">
        <h3 class="font-bold text-sm text-slate-700 mb-4">Transaksi Terbaru</h3>
        <div id="list-riwayat-singkat" class="space-y-4"></div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";
    let globalTransactions = [];
    let chartInstance = null;

    function togglePassword() {
      const p = document.getElementById("password");
      const i = document.getElementById("eye-icon");
      if(p.type === "password") { p.type = "text"; i.innerText = "🙈"; }
      else { p.type = "password"; i.innerText = "👁️"; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", username: user, password: pass }) })
      .then(res => res.json()).then(res => {
        if(res.status === "success") { localStorage.setItem("fw_user", user); location.reload(); }
        else alert(res.message);
      });
    }

    function handleLogout() { localStorage.clear(); location.reload(); }

    function renderFilteredData() {
      const filterPencatat = document.getElementById("filter-pencatat").value;
      const filterBulan = document.getElementById("filter-bulan").value;
      
      let saldoAwal = 0;
      let totalPemasukan = 0;
      let totalPengeluaran = 0;
      let dataGrafik = Array(12).fill(0);

      // Hitung data
      globalTransactions.forEach(trx => {
        const d = new Date(trx.timestamp);
        const m = d.getMonth().toString();
        const nominal = parseFloat(trx.nominal) || 0;
        const isPemasukan = trx.jenis.toLowerCase() === "pemasukan";
        
        // Filter Pencatat (Berlaku untuk semua)
        if (filterPencatat !== "all" && trx.pencatat !== filterPencatat) return;

        // 1. Logika Saldo Awal
        if (filterBulan === "all") {
           // Jika semua bulan, saldo awal adalah total pemasukan global
           if (isPemasukan) saldoAwal += nominal;
        } else {
           // Jika bulan spesifik, saldo awal adalah akumulasi bulan sebelumnya
           if (parseInt(m) < parseInt(filterBulan)) {
             saldoAwal += (isPemasukan ? nominal : -nominal);
           }
        }

        // 2. Logika Bulan Ini
        if (filterBulan === "all" || m === filterBulan) {
           if (isPemasukan) totalPemasukan += nominal;
           else totalPengeluaran += nominal;
        }

        // 3. Data Grafik
        dataGrafik[d.getMonth()] += (isPemasukan ? nominal : -nominal);
      });

      const sisaSaldo = (filterBulan === "all") ? (totalPemasukan - totalPengeluaran) : (saldoAwal + totalPemasukan - totalPengeluaran);
      const formatter = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
      
      document.getElementById("txt-saldo-awal").innerText = formatter.format(filterBulan === "all" ? totalPemasukan : saldoAwal);
      document.getElementById("txt-pengeluaran").innerText = formatter.format(totalPengeluaran);
      document.getElementById("txt-saldo").innerText = formatter.format(sisaSaldo);

      // Render Riwayat
      let html = "";
      globalTransactions.filter(t => (filterPencatat === "all" || t.pencatat === filterPencatat) && (filterBulan === "all" || new Date(t.timestamp).getMonth().toString() === filterBulan))
      .slice(-5).reverse().forEach(trx => {
        html += `<div class="flex justify-between items-center py-2"><p class="text-sm font-semibold">${trx.kategori}</p><span class="${trx.jenis.toLowerCase() == 'pengeluaran' ? 'text-rose-500' : 'text-emerald-500'} font-bold text-sm">${trx.jenis.toLowerCase() == 'pengeluaran' ? '-' : '+'}${formatter.format(trx.nominal)}</span></div>`;
      });
      document.getElementById("list-riwayat-singkat").innerHTML = html;

      // Render Chart
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('canvasTrenSaldo'), {
        type: 'line',
        data: { labels: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], datasets: [{ data: dataGrafik, borderColor: '#4f46e5', tension: 0.4, fill: true, backgroundColor: 'rgba(79, 70, 229, 0.1)' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    // Init
    if(localStorage.getItem("fw_user")) {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTransactions" }) })
      .then(r => r.json()).then(res => { 
        globalTransactions = res.data; 
        renderFilteredData(); 
      });
    }
  </script>
</body>
</html>
