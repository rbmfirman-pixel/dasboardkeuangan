<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <div id="login-section" class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8">

      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">

        <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-3 rounded-xl border bg-slate-50 dark:bg-slate-900">
        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl">Masuk</button>

    </div>
  </div>

  <div id="app-section" class="hidden flex-1 flex flex-col">

    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 pb-28">
      
      <div id="tab-home" class="tab-content space-y-6">
        <select id="filter-pencatat" onchange="loadHomeData()" class="w-full p-3 rounded-xl border dark:bg-slate-800">
          <option value="all">Semua Data</option>
          <option value="Suami">Suami</option>
          <option value="Istri">Istri</option>
        </select>

        <div class="grid grid-cols-2 gap-4">
          <div class="p-4 bg-white dark:bg-slate-800 rounded-2xl border shadow-sm">
            <p class="text-xs text-slate-400">Saldo Awal</p>
            <p id="saldo-awal" class="text-lg font-bold">Rp 0</p>
          </div>
          <div class="p-4 bg-indigo-600 text-white rounded-2xl shadow-lg">
            <p class="text-xs text-indigo-100">Sisa Uang</p>
            <p id="saldo-akhir" class="text-lg font-bold">Rp 0</p>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border shadow-sm">
          <canvas id="chartPengeluaran"></canvas>
        </div>

        <div id="list-riwayat-singkat" class="space-y-3">
          <h3 class="font-bold">Transaksi Terbaru</h3>
          </div>
      </div>

      <div id="tab-riwayat" class="tab-content hidden">...</div>
      <div id="tab-laporan" class="tab-content hidden">...</div>
      <div id="tab-setting" class="tab-content hidden">...</div>
    </main>

    <nav class="bg-white dark:bg-slate-800 border-t fixed bottom-0 w-full p-4 flex justify-around">
      <button onclick="switchTab('nav-home')">Home</button>
      <button onclick="switchTab('nav-riwayat')">Riwayat</button>
      <button onclick="switchTab('nav-laporan')">Laporan</button>
    </nav>
  </div>
