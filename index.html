<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyWealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #f1f5f9; }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Touch-Friendly Optimations */
    input, select { 
        height: 52px !important; 
        padding: 0 16px !important; 
        width: 100%;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        outline: none;
        font-size: 14px;
        background-color: white;
    }
    
    button { 
        border-radius: 16px; 
    }
    
    .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Hide scrollbar for aesthetic */
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-20">

  <div id="loader" class="loader-overlay">
    <div class="spinner mb-4"></div>
    <p class="font-bold text-slate-500">Memuat Data...</p>
  </div>

  <div id="login-section" class="fixed inset-0 flex items-center justify-center p-4 z-50 bg-slate-50 hidden">
    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
      <h1 class="text-2xl font-bold text-center mb-8 text-slate-800">FamilyWealth</h1>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="username" placeholder="Username" required>
        <div class="relative">
          <input type="password" id="password" placeholder="Password" required>
          <span onclick="togglePassword()" class="absolute right-5 top-4 cursor-pointer text-slate-400 select-none text-lg" id="eye-icon">👁️</span>
        </div>
        <button type="submit" class="w-full h-[56px] bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition active:scale-95">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden max-w-lg mx-auto fade-in">
    <header class="p-6 flex justify-between items-center bg-[#f8fafc] sticky top-0 z-30">
      <h2 id="header-title" class="font-bold text-xl text-slate-800">Dashboard</h2>
      <button onclick="handleLogout()" class="text-sm text-rose-500 font-bold bg-rose-50 px-5 py-2 rounded-full">Keluar</button>
    </header>

    <main id="view-home" class="px-6 space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <select id="filter-pencatat" onchange="renderFilteredData()">
          <option value="all">Semua Orang</option>
          <option value="Suami">Suami</option>
          <option value="Istri">Istri</option>
        </select>
        <select id="filter-bulan" onchange="renderFilteredData()">
          <option value="all">Semua Bulan</option>
          <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
          <option value="3">Apr</option><option value="4">Mei</option><option value="5">Jun</option>
          <option value="6">Jul</option><option value="7">Ags</option><option value="8">Sep</option>
          <option value="9">Okt</option><option value="10">Nov</option><option value="11">Des</option>
        </select>
      </div>

      <div class="bg-indigo-600 text-white p-7 rounded-3xl shadow-lg shadow-indigo-200">
        <p class="text-indigo-200 text-[11px] uppercase tracking-widest font-bold">Total Sisa Saldo</p>
        <h1 id="txt-saldo" class="text-3xl font-bold mt-1">Rp 0</h1>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="card p-5">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Saldo Awal</p>
          <p id="txt-saldo-awal" class="text-sm font-bold mt-1 text-slate-700">Rp 0</p>
        </div>
        <div class="card p-5">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Pengeluaran</p>
          <p id="txt-pengeluaran" class="text-sm font-bold mt-1 text-rose-500">Rp 0</p>
        </div>
      </div>

      <div class="card p-5 h-72">
        <canvas id="canvasTrenSaldo"></canvas>
      </div>

      <div class="card p-6 mb-4">
        <h3 class="font-bold text-sm text-slate-700 mb-4">Transaksi Terbaru</h3>
        <div id="list-riwayat-singkat" class="space-y-2"></div>
      </div>
    </main>

    <main id="view-riwayat" class="hidden px-6 space-y-4 fade-in">
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base select-none z-10">🔍</span>
        <input type="text" id="search-riwayat" placeholder="Cari kategori atau keterangan..." oninput="renderRiwayatLengkap()" class="bg-white border-none shadow-sm" style="padding-left: 44px !important;">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <select id="filter-riwayat-bulan" onchange="renderRiwayatLengkap()" class="border-none shadow-sm">
          <option value="all">Semua Bulan</option>
          <option value="0">Januari</option><option value="1">Februari</option><option value="2">Maret</option>
          <option value="3">April</option><option value="4">Mei</option><option value="5">Juni</option>
          <option value="6">Juli</option><option value="7">Agustus</option><option value="8">September</option>
          <option value="9">Oktober</option><option value="10">November</option><option value="11">Desember</option>
        </select>
        <select id="filter-riwayat-tahun" onchange="renderRiwayatLengkap()" class="border-none shadow-sm">
          <option value="all">Semua Tahun</option>
        </select>
      </div>

      <div id="list-riwayat-lengkap" class="space-y-3 pb-6"></div>
    </main>

  </div>

  <button onclick="loadDataFromServer(true)" id="btn-reload" class="hidden fixed bottom-24 right-6 bg-white/70 backdrop-blur-lg border border-white/50 text-indigo-600 w-14 h-14 rounded-full shadow-[0_12px_30px_rgba(79,70,229,0.25)] flex items-center justify-center z-50 active:scale-90 transition-all duration-200 select-none">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
  </button>

  <nav id="bottom-nav" class="hidden fixed bottom-0 w-full bg-white/70 backdrop-blur-lg border-t border-white/50 px-6 py-3 z-40 pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.03)]">
    <div class="max-w-lg mx-auto flex justify-around items-center">
      <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center p-2 text-indigo-600 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 mb-1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        <span class="text-[10px] font-bold">Home</span>
      </button>
      <button onclick="switchTab('riwayat')" id="nav-riwayat" class="flex flex-col items-center p-2 text-slate-400 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 mb-1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="text-[10px] font-bold">Riwayat</span>
      </button>
    </div>
  </nav>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";
    let globalTransactions = [];
    let chartInstance = null;
    const formatter = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });

    function togglePassword() {
      const p = document.getElementById("password");
      const i = document.getElementById("eye-icon");
      if(p.type === "password") { p.type = "text"; i.innerText = "🙈"; }
      else { p.type = "password"; i.innerText = "👁️"; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      document.getElementById("loader").classList.remove("hidden");
      
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", username: user, password: pass }) })
      .then(res => res.json()).then(res => {
        if(res.status === "success") { localStorage.setItem("fw_user", user); location.reload(); }
        else {
            document.getElementById("loader").classList.add("hidden");
            alert(res.message);
        }
      }).catch(err => {
          document.getElementById("loader").classList.add("hidden");
          alert("Gagal menghubungi server.");
      });
    }

    function handleLogout() { localStorage.clear(); location.reload(); }

    function switchTab(tab) {
        if(tab === 'home') {
            document.getElementById("view-home").classList.remove("hidden");
            document.getElementById("view-riwayat").classList.add("hidden");
            document.getElementById("header-title").innerText = "Dashboard";
            document.getElementById("nav-home").classList.replace("text-slate-400", "text-indigo-600");
            document.getElementById("nav-riwayat").classList.replace("text-indigo-600", "text-slate-400");
        } else {
            document.getElementById("view-home").classList.add("hidden");
            document.getElementById("view-riwayat").classList.remove("hidden");
            document.getElementById("header-title").innerText = "Riwayat Transaksi";
            document.getElementById("nav-riwayat").classList.replace("text-slate-400", "text-indigo-600");
            document.getElementById("nav-home").classList.replace("text-indigo-600", "text-slate-400");
            renderRiwayatLengkap();
        }
    }

    function loadDataFromServer(isReload = false) {
      document.getElementById("loader").classList.remove("hidden");
      
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTransactions" }) })
      .then(r => r.json()).then(res => { 
        if(res.status === "success") {
            globalTransactions = res.data; 
            
            if(!isReload) {
                const loggedInUser = localStorage.getItem("fw_user");
                const filterSelect = document.getElementById("filter-pencatat");
                if(loggedInUser === "Suami" || loggedInUser === "Istri") { filterSelect.value = loggedInUser; }
                document.getElementById("filter-bulan").value = new Date().getMonth();
            }
            
            initRiwayatFilters();
            renderFilteredData(); 
            renderRiwayatLengkap();
        } else {
            alert("Gagal memuat data: " + res.message);
        }
        document.getElementById("loader").classList.add("hidden"); 
      }).catch(err => {
          document.getElementById("loader").classList.add("hidden");
          alert("Gagal mengambil data dari server.");
      });
    }

    function initRiwayatFilters() {
        const selectTahun = document.getElementById("filter-riwayat-tahun");
        const currentSelection = selectTahun.value;
        selectTahun.innerHTML = '<option value="all">Semua Tahun</option>';
        
        const tahunSet = new Set();
        globalTransactions.forEach(trx => {
            if(trx.timestamp) {
                const year = new Date(trx.timestamp).getFullYear();
                if(year) tahunSet.add(year);
            }
        });
        
        let tahunArray = Array.from(tahunSet).sort((a,b) => b - a);
        tahunArray.forEach(thn => {
            let option = document.createElement("option");
            option.value = thn; option.text = thn;
            selectTahun.appendChild(option);
        });

        if(currentSelection && currentSelection !== "") {
            selectTahun.value = currentSelection;
        } else {
            const currentYear = new Date().getFullYear().toString();
            if(tahunArray.includes(parseInt(currentYear))) { selectTahun.value = currentYear; }
        }
        
        if(!document.getElementById("filter-riwayat-bulan").value) {
            document.getElementById("filter-riwayat-bulan").value = new Date().getMonth().toString();
        }
    }

    function renderRiwayatLengkap() {
        const filterBulan = document.getElementById("filter-riwayat-bulan").value;
        const filterTahun = document.getElementById("filter-riwayat-tahun").value;
        const searchVal = document.getElementById("search-riwayat").value.toLowerCase();
        
        let filtered = globalTransactions.filter(trx => {
            if(!trx.timestamp) return false;
            const date = new Date(trx.timestamp);
            const m = date.getMonth().toString();
            const y = date.getFullYear().toString();

            const matchBulan = (filterBulan === "all" || m === filterBulan);
            const matchTahun = (filterTahun === "all" || y === filterTahun);
            
            const kat = trx.kategori ? trx.kategori.toLowerCase() : "";
            const ket = trx.keterangan ? trx.keterangan.toLowerCase() : "";
            const matchSearch = (searchVal === "" || kat.includes(searchVal) || ket.includes(searchVal));

            return matchBulan && matchTahun && matchSearch;
        });

        filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        let html = "";
        filtered.forEach(trx => {
            const isPengeluaran = (trx.jenis ? trx.jenis.toLowerCase() : "") === 'pengeluaran';
            const ketDisplay = (trx.keterangan && trx.keterangan.trim() !== "") ? trx.keterangan : "-";
            const tglDisplay = new Date(trx.timestamp).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            const badgeColor = (trx.pencatat && trx.pencatat.toLowerCase() === 'suami') ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700';

            html += `
            <div class="card p-4 flex flex-col gap-2">
                <div class="flex justify-between items-center border-b border-slate-50 pb-2">
                    <span class="text-[10px] font-bold text-slate-400 flex items-center gap-1">📅 ${tglDisplay}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${badgeColor}">${trx.pencatat || '?'}</span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <div class="overflow-hidden min-w-0 pr-3 flex-1">
                        <p class="text-sm font-bold text-slate-800 truncate">${trx.kategori}</p>
                        <p class="text-[11px] text-slate-500 truncate mt-0.5">${ketDisplay}</p>
                    </div>
                    <span class="${isPengeluaran ? 'text-rose-500' : 'text-emerald-500'} font-bold text-sm whitespace-nowrap pl-2">
                        ${isPengeluaran ? '-' : '+'}${formatter.format(trx.nominal)}
                    </span>
                </div>
            </div>`;
        });

        if(html === "") html = `
            <div class="text-center py-10">
                <p class="text-4xl mb-3">🔍</p>
                <p class="text-sm text-slate-500">Tidak ada transaksi yang cocok.</p>
            </div>`;

        document.getElementById("list-riwayat-lengkap").innerHTML = html;
    }

    function renderFilteredData() {
      const filterPencatat = document.getElementById("filter-pencatat").value.toLowerCase();
      const filterBulan = document.getElementById("filter-bulan").value;
      
      let saldoAwal = 0; let totalPemasukan = 0; let totalPengeluaran = 0;

      globalTransactions.forEach(trx => {
        const d = new Date(trx.timestamp);
        const m = d.getMonth().toString();
        const nominal = parseFloat(trx.nominal) || 0;
        const jenis = trx.jenis ? trx.jenis.toLowerCase() : "";
        const isPemasukan = jenis === "pemasukan";
        const trxPencatat = trx.pencatat ? trx.pencatat.toLowerCase() : "";
        
        if (filterPencatat !== "all" && trxPencatat !== filterPencatat) return;
        if (filterBulan === "all") { if (isPemasukan) saldoAwal += nominal; } 
        else { if (parseInt(m) < parseInt(filterBulan)) { saldoAwal += (isPemasukan ? nominal : -nominal); } }
        if (filterBulan === "all" || m === filterBulan) {
           if (isPemasukan) totalPemasukan += nominal; else totalPengeluaran += nominal;
        }
      });

      const sisaSaldo = (filterBulan === "all") ? (totalPemasukan - totalPengeluaran) : (saldoAwal + totalPemasukan - totalPengeluaran);
      
      document.getElementById("txt-saldo-awal").innerText = formatter.format(filterBulan === "all" ? totalPemasukan : saldoAwal);
      document.getElementById("txt-pengeluaran").innerText = formatter.format(totalPengeluaran);
      document.getElementById("txt-saldo").innerText = formatter.format(sisaSaldo);

      let html = "";
      globalTransactions.filter(t => (filterPencatat === "all" || (t.pencatat && t.pencatat.toLowerCase() === filterPencatat)) && (filterBulan === "all" || new Date(t.timestamp).getMonth().toString() === filterBulan))
      .slice(-5).reverse().forEach(trx => {
        const jenis = trx.jenis ? trx.jenis.toLowerCase() : "";
        const isPengeluaran = jenis === 'pengeluaran';
        const ketDisplay = (trx.keterangan && trx.keterangan.trim() !== "") ? trx.keterangan : "-";
        
        html += `<div class="flex justify-between items-center py-2 border-b border-slate-50 last:border-0">
                   <div class="overflow-hidden min-w-0 pr-4 flex-1">
                     <p class="text-sm font-semibold text-slate-800 truncate">${trx.kategori}</p>
                     <p class="text-[11px] text-slate-400 truncate mt-0.5">${ketDisplay}</p>
                   </div>
                   <span class="${isPengeluaran ? 'text-rose-500' : 'text-emerald-500'} font-bold text-sm whitespace-nowrap pl-2">
                     ${isPengeluaran ? '-' : '+'}${formatter.format(trx.nominal)}
                   </span>
                 </div>`;
      });
      
      if(html === "") html = `<p class="text-sm text-slate-400 text-center py-4">Belum ada transaksi.</p>`;
      document.getElementById("list-riwayat-singkat").innerHTML = html;

      renderDailyChart();
    }

    function renderDailyChart() {
      const filterPencatat = document.getElementById("filter-pencatat").value.toLowerCase();
      const labels = []; const data = []; const today = new Date();
      
      for(let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(today.getDate() - i);
        labels.push(d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }));
        let dailySpend = 0;
        globalTransactions.forEach(trx => {
          if(!trx.timestamp) return;
          const tDate = new Date(trx.timestamp);
          const matchesDate = tDate.getDate() === d.getDate() && tDate.getMonth() === d.getMonth() && tDate.getFullYear() === d.getFullYear();
          const trxPencatat = trx.pencatat ? trx.pencatat.toLowerCase() : "";
          const matchesPencatat = filterPencatat === "all" || trxPencatat === filterPencatat;
          const jenis = trx.jenis ? trx.jenis.toLowerCase() : "";
          
          if (matchesDate && matchesPencatat && jenis === 'pengeluaran') { dailySpend += parseFloat(trx.nominal) || 0; }
        });
        data.push(dailySpend);
      }

      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('canvasTrenSaldo'), {
        type: 'line',
        data: { labels: labels, datasets: [{ label: 'Pengeluaran', data: data, borderColor: '#4f46e5', backgroundColor: 'rgba(79, 70, 229, 0.1)', fill: true, tension: 0.4, pointRadius: 6, pointHoverRadius: 8, pointBackgroundColor: '#4f46e5' }] },
        options: { responsive: true, maintainAspectRatio: false, interaction: { intersect: false, mode: 'index' }, elements: { point: { hitRadius: 25 } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { return ' Rp ' + context.parsed.y.toLocaleString('id-ID'); } } } }, scales: { y: { display: false, beginAtZero: true }, x: { grid: { display: false } } } }
      });
    }

    if(localStorage.getItem("fw_user")) {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      document.getElementById("bottom-nav").classList.remove("hidden");
      document.getElementById("btn-reload").classList.remove("hidden");
      
      loadDataFromServer(false);
    } else {
      document.getElementById("login-section").classList.remove("hidden");
      document.getElementById("loader").classList.add("hidden"); 
    }
  </script>
</body>
</html>
