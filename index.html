<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet Keluarga</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #111827;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }
    .text-truncate-custom {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    /* ================= LIGHT MODE OVERRIDES ================= */
    body.light-mode {
      background-color: #f3f4f6;
      color: #1f2937;
    }
    body.light-mode .bg-gray-800 {
      background-color: #ffffff !important;
      border-color: #d1d5db !important;
      color: #1f2937 !important;
    }
    body.light-mode .bg-gray-800\/60 {
      background-color: rgba(255, 255, 255, 0.8) !important;
      border-color: #e5e7eb !important;
    }
    body.light-mode .bg-gray-900 {
      background-color: #f9fafb !important;
      border-color: #d1d5db !important;
      color: #111827 !important;
    }
    body.light-mode .bg-gray-900\/90 {
      background-color: rgba(255, 255, 255, 0.95) !important;
      border-color: #e5e7eb !important;
    }
    body.light-mode .text-white {
      color: #111827 !important;
    }
    body.light-mode .text-gray-400 {
      color: #4b5563 !important;
    }
    body.light-mode .text-gray-200 {
      color: #1f2937 !important;
    }
    body.light-mode .text-gray-300 {
      color: #374151 !important;
    }
    body.light-mode .bg-gray-700 {
      background-color: #e5e7eb !important;
      color: #374151 !important;
    }
  </style>
</head>
<body class="pb-24">

  <!-- Tombol Tema Halaman Login -->
  <div id="themeToggleContainerLogin" class="absolute top-4 right-4 z-50">
    <button onclick="toggleTheme()" class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 border border-gray-700 cursor-pointer hover:text-white transition shadow-md">
      <i class="fa-solid fa-sun" id="themeIconLogin"></i>
    </button>
  </div>

  <!-- ================= FORM LOGIN ================= -->
  <div id="loginPage" class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-sm bg-gray-800 rounded-2xl p-6 shadow-xl border border-gray-700">
      <div class="flex justify-center mb-4 text-emerald-400 text-4xl">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <h2 class="text-2xl font-bold text-center mb-6">Masuk Ke Aplikasi</h2>
      <div class="mb-4">
        <label class="block text-xs text-gray-400 mb-1">Nama Pengguna</label>
        <input type="text" id="usernameInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500" placeholder="Masukkan username">
      </div>
      <div class="mb-6">
        <label class="block text-xs text-gray-400 mb-1">Kata Sandi</label>
        <div class="relative">
          <input type="password" id="passwordInput" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 pr-10 text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200 focus:outline-none cursor-pointer">
            <i id="passwordIcon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>
      <button onclick="prosesLogin()" id="btnLogin" class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold py-3 rounded-xl transition duration-200 cursor-pointer">
        Masuk
      </button>
    </div>
  </div>

  <!-- ================= HALAMAN UTAMA / DASBOR ================= -->
  <div id="mainPage" class="hidden max-w-md mx-auto px-4 pt-6">
    
    <!-- Header Pengguna -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <p class="text-xs text-gray-400">Selamat datang,</p>
        <div class="flex items-center gap-2 mt-0.5">
          <h1 id="userDisplay" class="text-2xl font-bold text-white">-</h1>
          <span id="badgeRole" class="text-[10px] uppercase font-extrabold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400">User</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 border border-gray-700 cursor-pointer hover:text-white transition">
          <i class="fa-solid fa-sun" id="themeIconMain"></i>
        </button>
        <div class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-emerald-400 border border-gray-700">
          <i class="fa-solid fa-user text-lg"></i>
        </div>
      </div>
    </div>

    <!-- Filter -->
    <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700 mb-5 space-y-3">
      <div id="adminFilterContainer" class="hidden">
        <label class="block text-[11px] uppercase tracking-wider text-gray-400 font-semibold mb-1">Tampilan Data</label>
        <select id="filterPencatat" onchange="muatDataKeuangan()" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="Semua">Semua Pencatat (Gabungan)</option>
        </select>
      </div>
      
      <div>
        <label class="block text-[11px] uppercase tracking-wider text-gray-400 font-semibold mb-1">Periode Bulan</label>
        <select id="filterBulan" onchange="muatDataKeuangan()" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          <option value="Semua">Sepanjang Tahun (Total)</option>
          <option value="01">Januari</option>
          <option value="02">Februari</option>
          <option value="03">Maret</option>
          <option value="04">April</option>
          <option value="05">Mei</option>
          <option value="06">Juni</option>
          <option value="07">Juli</option>
          <option value="08">Agustus</option>
          <option value="09">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Desember</option>
        </select>
      </div>
    </div>

    <!-- LOADING SCREEN CENTERED -->
    <div id="loadingState" class="flex flex-col items-center justify-center py-12 space-y-3">
      <div class="animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
      <p class="text-sm text-gray-400 font-medium">Sinkronisasi data...</p>
    </div>

    <!-- KONTEN UTAMA DASBOR -->
    <div id="dashboardContent" class="hidden space-y-5">
      <!-- Card Saldo -->
      <div class="bg-gray-800 rounded-2xl p-5 border border-gray-700 shadow-lg">
        <p class="text-xs text-gray-400 font-medium">Total Saldo Anda</p>
        <h2 id="txtSisaSaldo" class="text-3xl font-bold text-white mt-1 mb-5">Rp 0</h2>
        <div class="grid grid-cols-2 gap-4 border-t border-gray-700/60 pt-4">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-indigo-500/10 flex items-center justify-center text-indigo-400 text-xs">
              <i class="fa-solid fa-arrow-down"></i>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase tracking-wide">Pemasukan</p>
              <p id="txtPemasukan" class="text-sm font-semibold text-white">Rp 0</p>
            </div>
          </div>
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-rose-500/10 flex items-center justify-center text-rose-400 text-xs">
              <i class="fa-solid fa-arrow-up"></i>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase tracking-wide">Pengeluaran</p>
              <p id="txtPengeluaran" class="text-sm font-semibold text-white">Rp 0</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Area Grafik Tren Pengeluaran -->
      <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700 shadow-md">
        <h3 class="text-sm font-semibold text-white mb-3">Tren Pengeluaran Terakhir</h3>
        <div class="relative w-full h-56">
          <canvas id="canvasTren"></canvas>
        </div>
      </div>

      <!-- Daftar 5 Transaksi Terakhir -->
      <div>
        <h3 class="text-sm font-semibold text-white mb-3">5 Transaksi Terakhir</h3>
        <div id="listTransaksi" class="space-y-3"></div>
      </div>
    </div>

  </div>

  <!-- NAVIGATION BOTTOM -->
  <div id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 bg-gray-900/90 backdrop-blur-md border-t border-gray-800 py-2 z-50">
    <div class="max-w-md mx-auto grid grid-cols-4 items-center text-center">
      <button class="flex flex-col items-center gap-0.5 text-emerald-400 cursor-pointer">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-medium">Home</span>
      </button>
      <button onclick="alert('Menu Riwayat Lengkap Segera Hadir')" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-gray-300 cursor-pointer">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        <span class="text-[10px] font-medium">Riwayat</span>
      </button>
      <button onclick="alert('Menu Laporan Grafik Segera Hadir')" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-gray-300 cursor-pointer">
        <i class="fa-solid fa-chart-pie text-lg"></i>
        <span class="text-[10px] font-medium">Laporan</span>
      </button>
      <button onclick="prosesKeluar()" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-rose-400 cursor-pointer">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
        <span class="text-[10px] font-medium">Keluar</span>
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";

    let sessionUser = localStorage.getItem("app_user") || "";
    let sessionRole = localStorage.getItem("app_role") || "User";
    let chartInstance = null;

    window.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      const currentMonthIndex = new Date().getMonth() + 1;
      const currentMonthStr = (currentMonthIndex < 10 ? "0" : "") + currentMonthIndex;
      document.getElementById("filterBulan").value = currentMonthStr;

      if (sessionUser) {
        renderTampilanAplikasi();
      }
    });

    function togglePasswordVisibility() {
      const passInput = document.getElementById("passwordInput");
      const passIcon = document.getElementById("passwordIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        passIcon.classList.remove("fa-eye");
        passIcon.classList.add("fa-eye-slash");
      } else {
        passInput.type = "password";
        passIcon.classList.remove("fa-eye-slash");
        passIcon.classList.add("fa-eye");
      }
    }

    function applyTheme() {
      const currentTheme = localStorage.getItem("app_theme") || "dark";
      const iconLogin = document.getElementById("themeIconLogin");
      const iconMain = document.getElementById("themeIconMain");
      
      if (currentTheme === "light") {
        document.body.classList.add("light-mode");
        if(iconLogin) iconLogin.className = "fa-solid fa-moon";
        if(iconMain) iconMain.className = "fa-solid fa-moon";
      } else {
        document.body.classList.remove("light-mode");
        if(iconLogin) iconLogin.className = "fa-solid fa-sun";
        if(iconMain) iconMain.className = "fa-solid fa-sun";
      }
    }

    function toggleTheme() {
      const currentTheme = localStorage.getItem("app_theme") || "dark";
      localStorage.setItem("app_theme", currentTheme === "dark" ? "light" : "dark");
      applyTheme();
      if (sessionUser) muatDataKeuangan();
    }

    function formatRupiah(angka) {
      let isNegatif = angka < 0;
      let absolut = Math.abs(angka);
      let formatted = "Rp " + absolut.toLocaleString("id-ID");
      return isNegatif ? "- " + formatted : "+ " + formatted;
    }

    function prosesLogin() {
      const u = document.getElementById("usernameInput").value.trim();
      const p = document.getElementById("passwordInput").value;
      const btn = document.getElementById("btnLogin");

      if (!u || !p) return alert("Harap isi username dan password!");

      btn.disabled = true;
      btn.innerText = "Membuka Kunci...";

      fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            localStorage.setItem("app_user", res.username);
            localStorage.setItem("app_role", res.role);
            sessionUser = res.username;
            sessionRole = res.role;
            renderTampilanAplikasi();
          } else {
            alert("Username atau Password salah!");
            btn.disabled = false;
            btn.innerText = "Masuk";
          }
        })
        .catch(err => {
          console.error(err);
          alert("Koneksi gagal/Server sibuk");
          btn.disabled = false;
          btn.innerText = "Masuk";
        });
    }

    function renderTampilanAplikasi() {
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("themeToggleContainerLogin").classList.add("hidden");
      document.getElementById("mainPage").classList.remove("hidden");
      document.getElementById("bottomNav").classList.remove("hidden");

      document.getElementById("userDisplay").innerText = sessionUser;
      document.getElementById("badgeRole").innerText = sessionRole;

      if (sessionRole === "Admin") {
        document.getElementById("adminFilterContainer").classList.remove("hidden");
      }
      muatDataKeuangan();
    }

    function muatDataKeuangan() {
      const loadEl = document.getElementById("loadingState");
      const contentEl = document.getElementById("dashboardContent");
      
      loadEl.classList.remove("hidden");
      contentEl.classList.add("hidden");

      const pFilter = document.getElementById("filterPencatat").value;
      const bFilter = document.getElementById("filterBulan").value;

      let apiTarget = `${SCRIPT_URL}?action=getData&username=${encodeURIComponent(sessionUser)}&role=${sessionRole}&filterPencatat=${encodeURIComponent(pFilter)}&filterBulan=${bFilter}`;

      fetch(apiTarget)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            document.getElementById("txtSisaSaldo").innerText = "Rp " + res.data.sisa.toLocaleString("id-ID");
            document.getElementById("txtPemasukan").innerText = "Rp " + res.data.pemasukan.toLocaleString("id-ID");
            document.getElementById("txtPengeluaran").innerText = "Rp " + res.data.pengeluaran.toLocaleString("id-ID");

            if (sessionRole === "Admin") {
              const dropdown = document.getElementById("filterPencatat");
              const currentVal = dropdown.value;
              dropdown.innerHTML = '<option value="Semua">Semua Pencatat (Gabungan)</option>';
              res.data.pencatatTersedia.forEach(p => {
                let opt = document.createElement("option");
                opt.value = p;
                opt.innerText = p;
                dropdown.appendChild(opt);
              });
              dropdown.value = currentVal;
            }

            const boxTrx = document.getElementById("listTransaksi");
            boxTrx.innerHTML = "";

            if (res.data.riwayat.length === 0) {
              boxTrx.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">Tidak ada riwayat transaksi pada periode ini.</p>';
            } else {
              res.data.riwayat.forEach(item => {
                let isMin = item.jenis === "Pengeluaran";
                let colorNominal = isMin ? "text-rose-400" : "text-emerald-400";
                let iconCat = isMin ? "fa-solid fa-utensils text-orange-400" : "fa-solid fa-wallet text-indigo-400";
                if(item.kategori.toLowerCase().includes("komisi") || item.kategori.toLowerCase().includes("gaji")) iconCat = "fa-solid fa-wallet text-indigo-400";
                if(item.kategori.toLowerCase().includes("lain")) iconCat = "fa-solid fa-file-lines text-slate-400";

                let htmlCard = `
                  <div class="bg-gray-800/60 border border-gray-700/50 rounded-xl p-3.5 flex items-center justify-between gap-2 shadow-sm">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 h-10 bg-gray-900 rounded-xl flex items-center justify-center text-sm shrink-0">
                        <i class="${iconCat}"></i>
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <h4 class="text-sm font-semibold text-gray-200 text-truncate-custom" title="${item.keterangan}">${item.keterangan || item.kategori}</h4>
                          <span class="text-[9px] bg-gray-700 px-1.5 py-0.5 rounded text-gray-300 font-medium shrink-0">${item.pencatat}</span>
                        </div>
                        <p class="text-[11px] text-gray-400 mt-0.5">${item.tanggal} • ${item.kategori}</p>
                      </div>
                    </div>
                    <span class="text-sm font-bold tracking-wide shrink-0 ${colorNominal}">
                      ${formatRupiah(isMin ? -item.nominal : item.nominal)}
                    </span>
                  </div>
                `;
                boxTrx.innerHTML += htmlCard;
              });
            }

            buildChart(res.data.grafikLabels, res.data.grafikData);

            loadEl.classList.add("hidden");
            contentEl.classList.remove("hidden");
          }
        })
        .catch(err => {
          console.error(err);
          alert("Gagal memuat data dari spreadsheet.");
        });
    }

    function buildChart(labels, data) {
      const ctx = document.getElementById("canvasTren").getContext("2d");
      if (chartInstance) {
        chartInstance.destroy();
      }

      const isLightMode = document.body.classList.contains("light-mode");
      const gridColor = isLightMode ? 'rgba(209, 213, 219, 0.7)' : 'rgba(55, 65, 81, 0.4)';
      const labelColor = isLightMode ? '#4b5563' : '#9ca3af';

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Pengeluaran',
            data: data,
            borderColor: '#f43f5e',
            backgroundColor: 'rgba(244, 63, 94, 0.15)',
            borderWidth: 2,
            pointBackgroundColor: '#f43f5e',
            pointRadius: 4,
            tension: 0.4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { 
              grid: { display: false }, 
              ticks: { 
                color: labelColor, 
                font: { size: 10 },
                maxRotation: 0, // Mencegah teks tanggal berputar miring
                minRotation: 0
              } 
            },
            y: { grid: { color: gridColor }, ticks: { display: false } }
          }
        }
      });
    }

    function prosesKeluar() {
      localStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
