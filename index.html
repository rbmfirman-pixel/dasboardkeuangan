<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyWealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #f1f5f9; }
    input, select, button { min-height: 48px; }
    /* Loading Spinner */
    .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); z-index: 100; display: flex; justify-content: center; align-items: center; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen text-slate-800">

  <div id="loader" class="loader-overlay hidden">
    <div class="spinner"></div>
  </div>

  <div id="login-section" class="fixed inset-0 flex items-center justify-center p-4 z-50 bg-slate-50">
    <div class="w-full max-w-sm bg-white p-6 rounded-3xl shadow-2xl border border-slate-100">
      <h1 class="text-2xl font-bold text-center mb-6 text-slate-800">FamilyWealth</h1>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="username" placeholder="Username" required class="w-full px-4 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
        <div class="relative">
          <input type="password" id="password" placeholder="Password" required class="w-full px-4 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
          <span onclick="togglePassword()" class="absolute right-4 top-4 cursor-pointer text-slate-400" id="eye-icon">👁️</span>
        </div>
        <button type="submit" id="btn-login" class="w-full bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 active:scale-95 transition-all">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden pb-10 max-w-lg mx-auto fade-in">
    <header class="p-6 flex justify-between items-center">
      <h2 class="font-bold text-xl text-slate-800">Dashboard</h2>
      <button onclick="handleLogout()" class="text-xs text-rose-500 font-bold bg-rose-50 px-4 py-2 rounded-full">Keluar</button>
    </header>

    <main class="px-6 space-y-6">
      <div class="grid grid-cols-2 gap-3">
        <select id="filter-pencatat" onchange="renderFilteredData()" class="px-4 rounded-xl border border-slate-200 bg-white font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">Semua Orang</option>
          <option value="Suami">Suami</option>
          <option value="Istri">Istri</option>
        </select>
        <select id="filter-bulan" onchange="renderFilteredData()" class="px-4 rounded-xl border border-slate-200 bg-white font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">Semua Bulan</option>
          <option value="0">Januari</option><option value="1">Februari</option><option value="2">Maret</option>
          <option value="3">April</option><option value="4">Mei</option><option value="5">Juni</option>
          <option value="6">Juli</option><option value="7">Agustus</option><option value="8">September</option>
          <option value="9">Oktober</option><option value="10">November</option><option value="11">Desember</option>
        </select>
      </div>

      <div class="bg-indigo-600 text-white p-6 rounded-3xl shadow-lg shadow-indigo-200">
        <p class="text-indigo-200 text-xs uppercase tracking-widest font-bold">Total Sisa Saldo</p>
        <h1 id="txt-saldo" class="text-3xl font-bold mt-2">Rp 0</h1>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="card p-4">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Saldo Awal</p>
          <p id="txt-saldo-awal" class="text-sm font-bold mt-1 text-slate-700">Rp 0</p>
        </div>
        <div class="card p-4">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Pengeluaran</p>
          <p id="txt-pengeluaran" class="text-sm font-bold mt-1 text-rose-500">Rp 0</p>
        </div>
      </div>

      <div class="card p-5 h-64">
        <canvas id="canvasTrenSaldo"></canvas>
      </div>

      <div class="card p-5">
        <h3 class="font-bold text-sm text-slate-700 mb-4">Transaksi Terbaru</h3>
        <div id="list-riwayat-singkat" class="space-y-4"></div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";
    let globalTransactions = [];
    let chartInstance = null;

    function toggleLoader(show) { document.getElementById("loader").classList.toggle("hidden", !show); }

    function togglePassword() {
      const p = document.getElementById("password");
      const i = document.getElementById("eye-icon");
      if(p.type === "password") { p.type = "text"; i.innerText = "🙈"; }
      else { p.type = "password"; i.innerText = "👁️"; }
    }

    function handleLogin(e) {
      e.preventDefault();
      toggleLoader(true);
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", username: user, password: pass }) })
      .then(res => res.json()).then(res => {
        toggleLoader(false);
        if(res.status === "success") {
          localStorage.setItem("fw_user", user);
          location.reload();
        } else alert(res.message);
      });
    }

    function handleLogout() { localStorage.clear(); location.reload(); }

    function renderFilteredData() {
      const filterPencatat = document.getElementById("filter-pencatat").value;
      const filterBulan = document.getElementById("filter-bulan").value;
      const now = new Date();
      const currentYear = now.getFullYear();

      let saldoAwal = 0;
      let pemasukan = 0;
      let pengeluaran = 0;
      let bulananNet = Array(12).fill(0);

      globalTransactions.forEach(trx => {
        const d = new Date(trx.timestamp);
        // Filter Logic
        if (filterPencatat !== "all" && trx.pencatat !== filterPencatat) return;
        if (filterBulan !== "all" && d.getMonth().toString() !== filterBulan) return;
        
        const val = trx.jenis.toLowerCase() === "pengeluaran" ? -trx.nominal : trx.nominal;

        if (d.getFullYear() === currentYear) bulananNet[d.getMonth()] += val;
        
        if (d.getFullYear() < currentYear || (d.getFullYear() === currentYear && d.getMonth() < d.getMonth())) {
          saldoAwal += val;
        } else if (d.getFullYear() === currentYear && d.getMonth() === (filterBulan !== "all" ? parseInt(filterBulan) : d.getMonth())) {
          if (trx.jenis.toLowerCase() === "pengeluaran") pengeluaran += trx.nominal;
          else pemasukan += trx.nominal;
        }
      });

      const formatter = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
      document.getElementById("txt-saldo-awal").innerText = formatter.format(saldoAwal);
      document.getElementById("txt-saldo").innerText = formatter.format(saldoAwal + pemasukan - pengeluaran);
      document.getElementById("txt-pengeluaran").innerText = formatter.format(pengeluaran);

      // Render Chart
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('canvasTrenSaldo'), {
        type: 'line',
        data: { labels: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], datasets: [{ data: bulananNet, borderColor: '#4f46e5', tension: 0.4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      let html = "";
      [...globalTransactions].filter(t => (filterPencatat === "all" || t.pencatat === filterPencatat) && (filterBulan === "all" || new Date(t.timestamp).getMonth().toString() === filterBulan)).reverse().slice(0, 5).forEach(trx => {
        html += `<div class="flex justify-between items-center py-2"><p class="text-sm font-semibold">${trx.kategori}</p><span class="${trx.jenis.toLowerCase() == 'pengeluaran' ? 'text-rose-500' : 'text-emerald-500'} font-bold text-sm">${trx.jenis.toLowerCase() == 'pengeluaran' ? '-' : '+'}${formatter.format(trx.nominal)}</span></div>`;
      });
      document.getElementById("list-riwayat-singkat").innerHTML = html;
    }

    if(localStorage.getItem("fw_user")) {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      toggleLoader(true);
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTransactions" }) })
      .then(r => r.json())
      .then(res => { 
        toggleLoader(false);
        globalTransactions = res.data; 
        renderFilteredData(); 
      });
    }
  </script>
</body>
</html>
