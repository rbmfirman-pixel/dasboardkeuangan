<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyWealth</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">

  <div id="login-section" class="fixed inset-0 flex items-center justify-center p-4 z-50 bg-slate-50">
    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl">
      <h1 class="text-2xl font-bold text-center mb-6">FamilyWealth</h1>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="username" placeholder="Username" required class="w-full p-3 rounded-xl border bg-slate-50">
        <input type="password" id="password" placeholder="Password" required class="w-full p-3 rounded-xl border bg-slate-50">
        <button type="submit" id="btn-login" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden pb-24">
    <header class="p-4 bg-white border-b flex justify-between items-center sticky top-0 z-40">
      <h2 class="font-bold text-lg">FamilyWealth</h2>
      <button onclick="handleLogout()" class="text-xs text-red-500 font-bold">Keluar</button>
    </header>

    <main class="p-4 space-y-4">
      <select id="filter-pencatat" onchange="renderFilteredData()" class="w-full p-3 rounded-xl border bg-white font-medium text-sm">
        <option value="all">Semua Data</option>
        <option value="Suami">Suami</option>
        <option value="Istri">Istri</option>
      </select>

      <div class="grid grid-cols-2 gap-3">
        <div class="p-4 bg-white rounded-2xl border shadow-sm">
          <p class="text-[10px] text-slate-500 uppercase font-bold">Saldo Awal</p>
          <p id="txt-saldo-awal" class="text-sm font-bold mt-1">Rp 0</p>
        </div>
        <div class="p-4 bg-indigo-600 rounded-2xl shadow-lg text-white">
          <p class="text-[10px] text-indigo-100 uppercase font-bold">Sisa Saldo</p>
          <p id="txt-saldo" class="text-sm font-bold mt-1">Rp 0</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl border shadow-sm h-64">
        <canvas id="canvasTrenSaldo"></canvas>
      </div>

      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <h3 class="font-bold text-sm mb-3">Transaksi Terbaru</h3>
        <div id="list-riwayat-singkat" class="space-y-3"></div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";
    let globalTransactions = [];
    let chartInstance = null;

    // FUNGSI LOGIN (Sama seperti sebelumnya)
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", username: user, password: pass }) })
      .then(res => res.json()).then(res => {
        if(res.status === "success") {
          localStorage.setItem("fw_user", user);
          localStorage.setItem("fw_role", res.role);
          localStorage.setItem("fw_pencatat", res.pencatat);
          location.reload();
        } else alert(res.message);
      });
    }

    function handleLogout() { localStorage.clear(); location.reload(); }

    // FUNGSI RENDER UTAMA
    function renderFilteredData() {
      const filter = document.getElementById("filter-pencatat").value;
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      let saldoAwal = 0;
      let pemasukan = 0;
      let pengeluaran = 0;
      let bulananNet = Array(12).fill(0);

      globalTransactions.forEach(trx => {
        if (filter !== "all" && trx.pencatat !== filter) return;
        const d = new Date(trx.timestamp);
        const val = trx.jenis.toLowerCase() === "pengeluaran" ? -trx.nominal : trx.nominal;

        if (d.getFullYear() === currentYear) bulananNet[d.getMonth()] += val;
        
        // Logika Saldo: Semua transaksi sebelum bulan ini adalah Saldo Awal
        if (d.getFullYear() < currentYear || (d.getFullYear() === currentYear && d.getMonth() < currentMonth)) {
          saldoAwal += val;
        } else if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) {
          if (trx.jenis.toLowerCase() === "pengeluaran") pengeluaran += trx.nominal;
          else pemasukan += trx.nominal;
        }
      });

      document.getElementById("txt-saldo-awal").innerText = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR" }).format(saldoAwal);
      document.getElementById("txt-saldo").innerText = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR" }).format(saldoAwal + pemasukan - pengeluaran);

      // Grafik
      let dataGrafik = [];
      let running = 0;
      for(let i=0; i<=currentMonth; i++) { running += bulananNet[i]; dataGrafik.push(running); }
      renderChart(dataGrafik);

      // List
      let html = "";
      globalTransactions.slice(0, 5).forEach(trx => {
        html += `<div class="flex justify-between text-sm"><span>${trx.kategori}</span><span class="${trx.jenis == 'Pengeluaran' ? 'text-red-500' : 'text-green-500'}">${trx.jenis == 'Pengeluaran' ? '-' : '+'}${trx.nominal}</span></div>`;
      });
      document.getElementById("list-riwayat-singkat").innerHTML = html;
    }

    function renderChart(data) {
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('canvasTrenSaldo'), {
        type: 'line',
        data: { labels: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'].slice(0, data.length), datasets: [{ data: data, borderColor: '#4f46e5', tension: 0.3 }] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // INIT
    if(localStorage.getItem("fw_user")) {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTransactions" }) })
      .then(r=>r.json()).then(res => { globalTransactions = res.data; renderFilteredData(); });
    }
  </script>
</body>
</html>
