<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyWealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    
    /* Global Styles */
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #f1f5f9; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Optimasi Spacing & Symmetry */
    input, select { 
        padding: 14px 20px !important; 
        width: 100%;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        outline: none;
    }
    input:focus, select:focus { border-color: #4f46e5; ring: 2px solid #e0e7ff; }
    
    button { padding: 14px 20px; border-radius: 14px; }
    
    .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen text-slate-800">

  <div id="loader" class="loader-overlay">
    <div class="spinner mb-4"></div>
    <p class="font-bold text-slate-500">Memuat Data...</p>
  </div>

  <div id="login-section" class="fixed inset-0 flex items-center justify-center p-4 z-50 bg-slate-50 hidden">
    <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
      <h1 class="text-2xl font-bold text-center mb-8 text-slate-800">FamilyWealth</h1>
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="username" placeholder="Username" required>
        <div class="relative">
          <input type="password" id="password" placeholder="Password" required>
          <span onclick="togglePassword()" class="absolute right-5 top-4 cursor-pointer text-slate-400 select-none" id="eye-icon">👁️</span>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden pb-10 max-w-lg mx-auto fade-in">
    <header class="p-6 flex justify-between items-center">
      <h2 class="font-bold text-xl text-slate-800">Dashboard</h2>
      <button onclick="handleLogout()" class="text-sm text-rose-500 font-bold bg-rose-50 px-6 py-2 rounded-full">Keluar</button>
    </header>

    <main class="px-6 space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <select id="filter-pencatat" onchange="renderFilteredData()">
          <option value="all">Semua Orang</option>
          <option value="Suami">Suami</option>
          <option value="Istri">Istri</option>
        </select>
        <select id="filter-bulan" onchange="renderFilteredData()">
          <option value="all">Semua Bulan</option>
          <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
          <option value="3">Apr</option><option value="4">Mei</option><option value="5">Jun</option>
        </select>
      </div>

      <div class="bg-indigo-600 text-white p-7 rounded-3xl shadow-lg shadow-indigo-200">
        <p class="text-indigo-200 text-[11px] uppercase tracking-widest font-bold">Total Sisa Saldo</p>
        <h1 id="txt-saldo" class="text-3xl font-bold mt-1">Rp 0</h1>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="card p-5">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Saldo Awal</p>
          <p id="txt-saldo-awal" class="text-sm font-bold mt-1 text-slate-700">Rp 0</p>
        </div>
        <div class="card p-5">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Pengeluaran</p>
          <p id="txt-pengeluaran" class="text-sm font-bold mt-1 text-rose-500">Rp 0</p>
        </div>
      </div>

      <div class="card p-5 h-72">
        <canvas id="canvasTrenSaldo"></canvas>
      </div>

      <div class="card p-6">
        <h3 class="font-bold text-sm text-slate-700 mb-4">Transaksi Terbaru</h3>
        <div id="list-riwayat-singkat" class="space-y-4"></div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzGOv26svKIlGAJg7pmzVfixFVPYtdAPjX9X8g2qYcGK8cwa0dNJTfjAUc2qNsXtQ/exec";
    let globalTransactions = [];
    let chartInstance = null;

    function togglePassword() {
      const p = document.getElementById("password");
      const i = document.getElementById("eye-icon");
      if(p.type === "password") { p.type = "text"; i.innerText = "🙈"; }
      else { p.type = "password"; i.innerText = "👁️"; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", username: user, password: pass }) })
      .then(res => res.json()).then(res => {
        if(res.status === "success") { localStorage.setItem("fw_user", user); location.reload(); }
        else alert(res.message);
      });
    }

    function handleLogout() { localStorage.clear(); location.reload(); }

    function renderFilteredData() {
      const filterPencatat = document.getElementById("filter-pencatat").value.toLowerCase();
      const filterBulan = document.getElementById("filter-bulan").value;
      
      let saldoAwal = 0;
      let totalPemasukan = 0;
      let totalPengeluaran = 0;

      globalTransactions.forEach(trx => {
        const d = new Date(trx.timestamp);
        const m = d.getMonth().toString();
        const nominal = parseFloat(trx.nominal) || 0;
        const isPemasukan = trx.jenis.toLowerCase() === "pemasukan";
        const trxPencatat = trx.pencatat.toLowerCase();
        
        if (filterPencatat !== "all" && trxPencatat !== filterPencatat) return;

        if (filterBulan === "all") {
           if (isPemasukan) saldoAwal += nominal;
        } else {
           if (parseInt(m) < parseInt(filterBulan)) {
             saldoAwal += (isPemasukan ? nominal : -nominal);
           }
        }

        if (filterBulan === "all" || m === filterBulan) {
           if (isPemasukan) totalPemasukan += nominal;
           else totalPengeluaran += nominal;
        }
      });

      const sisaSaldo = (filterBulan === "all") ? (totalPemasukan - totalPengeluaran) : (saldoAwal + totalPemasukan - totalPengeluaran);
      const formatter = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
      
      document.getElementById("txt-saldo-awal").innerText = formatter.format(filterBulan === "all" ? totalPemasukan : saldoAwal);
      document.getElementById("txt-pengeluaran").innerText = formatter.format(totalPengeluaran);
      document.getElementById("txt-saldo").innerText = formatter.format(sisaSaldo);

      let html = "";
      globalTransactions.filter(t => (filterPencatat === "all" || t.pencatat.toLowerCase() === filterPencatat) && (filterBulan === "all" || new Date(t.timestamp).getMonth().toString() === filterBulan))
      .slice(-5).reverse().forEach(trx => {
        html += `<div class="flex justify-between items-center py-1"><p class="text-sm font-semibold">${trx.kategori}</p><span class="${trx.jenis.toLowerCase() == 'pengeluaran' ? 'text-rose-500' : 'text-emerald-500'} font-bold text-sm">${trx.jenis.toLowerCase() == 'pengeluaran' ? '-' : '+'}${formatter.format(trx.nominal)}</span></div>`;
      });
      document.getElementById("list-riwayat-singkat").innerHTML = html;

      renderDailyChart();
    }

    function renderDailyChart() {
      const filterPencatat = document.getElementById("filter-pencatat").value.toLowerCase();
      const labels = [];
      const data = [];
      const today = new Date();
      
      for(let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        labels.push(d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }));
        
        let dailySpend = 0;
        globalTransactions.forEach(trx => {
          const tDate = new Date(trx.timestamp);
          const matchesDate = tDate.getDate() === d.getDate() && tDate.getMonth() === d.getMonth() && tDate.getFullYear() === d.getFullYear();
          const matchesPencatat = filterPencatat === "all" || trx.pencatat.toLowerCase() === filterPencatat;
          
          if (matchesDate && matchesPencatat) {
             if (trx.jenis.toLowerCase() === 'pengeluaran') dailySpend += parseFloat(trx.nominal);
          }
        });
        data.push(dailySpend);
      }

      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('canvasTrenSaldo'), {
        type: 'line',
        data: { 
            labels: labels, 
            datasets: [{ 
                label: 'Pengeluaran', 
                data: data, 
                borderColor: '#4f46e5', 
                backgroundColor: 'rgba(79, 70, 229, 0.1)', 
                fill: true,
                tension: 0.4,
                pointRadius: 6,
                pointHoverRadius: 8,
                pointBackgroundColor: '#4f46e5'
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            interaction: { intersect: false, mode: 'index' },
            elements: { point: { hitRadius: 25 } },
            plugins: { 
                legend: { display: false },
                tooltip: { callbacks: { label: function(context) { return ' Rp ' + context.parsed.y.toLocaleString('id-ID'); } } }
            },
            scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
        }
      });
    }

    if(localStorage.getItem("fw_user")) {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTransactions" }) })
      .then(r => r.json()).then(res => { 
        globalTransactions = res.data; 
        const loggedInUser = localStorage.getItem("fw_user");
        const filterSelect = document.getElementById("filter-pencatat");
        if(loggedInUser === "Suami" || loggedInUser === "Istri") {
            filterSelect.value = loggedInUser;
        }
        const currentMonth = new Date().getMonth();
        const monthSelect = document.getElementById("filter-bulan");
        if(currentMonth <= 5) monthSelect.value = currentMonth;
        renderFilteredData(); 
        document.getElementById("loader").classList.add("hidden"); 
      });
    } else {
      document.getElementById("login-section").classList.remove("hidden");
      document.getElementById("loader").classList.add("hidden"); 
    }
  </script>
</body>
</html>
